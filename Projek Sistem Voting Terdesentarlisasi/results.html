<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hasil Voting</title>
  <link rel="stylesheet" href="style.css">
  <!-- ethers.js UMD build -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Lihat Hasil Voting</h1>
    </header>
    <section class="form-section">
      <div class="form-box">
        <form id="resultsForm">
          <label for="resultPollId">ID Poll</label>
          <input type="number" id="resultPollId" placeholder="Masukkan ID Poll" required>
          <button type="submit">Lihat Hasil</button>
        </form>
        <div id="resultsDisplay"></div>
        <button id="shareButton">Share Hasil Voting</button>
      </div>
    </section>
    <footer>
      <nav>
        <a href="index.html">Kembali ke Home</a>
      </nav>
    </footer>
    <script src="results.js"></script>
  </div>
</body>
</html>
